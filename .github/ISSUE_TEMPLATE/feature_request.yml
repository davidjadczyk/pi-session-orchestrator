---
name: Feature request
description: Suggest a focused improvement to pi-session-orchestrator.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user outcome. Do not include credentials, private paths,
        session transcripts, or other non-public data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or maintainer need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or alternative approach have you considered?
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, private paths, and non-public data.
          required: true
