---
name: Bug report
description: Report a reproducible problem in pi-session-orchestrator.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the extension. Do not include credentials,
        tokens, private paths, or session transcripts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        List the smallest repeatable steps, including the Pi and extension
        versions when known.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: >-
        Add sanitized errors or screenshots if useful. Remove secrets and
        personal data.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, private paths, and non-public data.
          required: true
