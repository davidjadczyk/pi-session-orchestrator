# TEMPORARY FIRST-RELEASE BOOTSTRAP.
# Remove this workflow and its bootstrap secret after npm trusted publishing is
# configured for .github/workflows/publish.yml.
name: Bootstrap first npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag; this bootstrap accepts only v0.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-bootstrap:
    # workflow_dispatch can target another ref; accept only protected main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify the exact first-release tag and remote main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v0.2.0" ]]; then
            echo "bootstrap input must be exactly v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "refs/heads/main:refs/remotes/origin/main"
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "bootstrap tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$main_commit" || \
            "$head_commit" != "$main_commit" ]]; then
            echo "annotated tag, checked-out main, and remote main must" \
              "point to the same commit" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "0.2.0" || \
            "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "bootstrap tag must match package version 0.2.0" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify package files
        run: npm run verify-pack
      - name: Verify package dry run
        run: npm pack --dry-run --json --ignore-scripts
      - name: Publish first package with bootstrap credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: >-
          npm publish --provenance --access public
          --registry=https://registry.npmjs.org
